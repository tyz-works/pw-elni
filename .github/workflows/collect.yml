name: collect

on:
  # 毎日 8:00 JST。前日の興行結果が公式に掲載された頃に回す。
  # GH Actions の cron は負荷により数分〜十数分遅れることがある。
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      promotion:
        description: 団体 slug（カンマ区切り。空なら決定論的な団体すべて）
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # 決定論的なパーサだけで取れる団体。検証を通れば自動でマージする。
  deterministic:
    name: 収集して自動マージ（ddt / stardom）
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # バージョンの真実は .node-version 1 箇所
          node-version-file: .node-version
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: ブラウザを導入
        run: npx playwright install --with-deps chromium

      # 取得結果と LLM の抽出結果を実行間で持ち越す。GH Actions は毎回
      # まっさらなので、残さないと同じ記事を毎日 LLM に投げることになる。
      - name: 収集キャッシュを復元
        uses: actions/cache@v4
        with:
          path: .cache
          key: collect-cache-${{ github.run_id }}
          restore-keys: collect-cache-

      # run.mjs は失敗した団体があると exit 1 を返すが、部分失敗を許容する
      # 設計なので取れた分は PR にしたい。失敗した団体はレポートに載る。
      #
      # 入力は ${{ }} で run: に直接展開せず env 経由で渡す。展開すると
      # 団体 slug にシェルを書かれたときにそのまま実行される。
      - name: 収集
        id: collect
        env:
          PROMOTION: ${{ inputs.promotion }}
        run: |
          PROMOTIONS="${PROMOTION:-ddt,stardom}"
          # njpw は目視してから取り込むので必ず別ジョブに回す。
          # 手動実行で njpw を指定されても、ここでは絶対に扱わない。
          PROMOTIONS="$(echo "$PROMOTIONS" | tr ',' '\n' | grep -v '^njpw$' | paste -sd, -)"
          if [ -z "$PROMOTIONS" ]; then
            echo '自動マージ対象の団体が無いので何もしない'
            echo 'ran=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ran=true' >> "$GITHUB_OUTPUT"
          npm run collect -- --promotion "$PROMOTIONS"
        continue-on-error: true

      # 自動マージするので、人間のレビューの代わりに門をここで通す。
      # GITHUB_TOKEN が作った PR は workflow を起動しないため、PR 側では
      # CI が回らない。npm run build は先に npm run validate を走らせる。
      - name: 検証とビルド
        if: steps.collect.outputs.ran == 'true'
        run: npm run build

      # レポートは公式サイト由来の文字列を含む。GITHUB_OUTPUT に流すと
      # 区切り文字を書かれたときに任意の output を差し込めるので、
      # ファイルのまま body-path で渡す。
      - name: PR を作る
        id: pr
        if: steps.collect.outputs.ran == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: collect/auto
          base: main
          title: "データ収集: ${{ github.run_started_at }}"
          body-path: .cache/report.md
          commit-message: |
            公式サイトから興行データを取り込む

            tools/collect による自動収集。詳細は PR 本文のレポートを参照。
          add-paths: data/
          delete-branch: false

      # 差分が無ければ PR は作られない。その場合は何もしない。
      - name: PR をマージ
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch

      - name: Telegram に通知
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        env:
          LABEL: 自動マージ（ddt / stardom）
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/notify-telegram.sh

  # 新日本は記事本文から LLM で組み立てるので、内容を目視してから取り込む。
  # PR は作るがマージはしない。deterministic の後に回して、更新済みの main
  # を土台にする。
  njpw-review:
    name: 収集して PR だけ作る（njpw / LLM）
    needs: deterministic
    # deterministic の後に回して更新済みの main を土台にするが、
    # あちらが落ちてもこちらは止めない（部分失敗を許容する設計）。
    if: ${{ always() && (inputs.promotion == '' || contains(inputs.promotion, 'njpw')) }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: ブラウザを導入
        run: npx playwright install --with-deps chromium

      - name: 収集キャッシュを復元
        uses: actions/cache@v4
        with:
          path: .cache
          key: collect-cache-njpw-${{ github.run_id }}
          restore-keys: collect-cache-njpw-

      - name: 収集
        env:
          # 鍵が無ければ LLM 段は動かず、記事本文は取りこぼしとして報告される。
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 1 回の実行で呼ぶ上限。取りこぼしが急に増えても課金が跳ねない。
          LLM_MAX_CALLS: '30'
        run: npm run collect -- --promotion njpw
        continue-on-error: true

      # マージしないので門は緩くてよいが、壊れたものを PR にしても仕方ない。
      - name: 検証とビルド
        run: npm run build

      - name: PR を作る
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: collect/njpw-review
          base: main
          title: "データ収集（要確認・新日本）: ${{ github.run_started_at }}"
          body-path: .cache/report.md
          commit-message: |
            新日本の興行データを取り込む

            記事本文から LLM で組み立てたもの。内容を確認してからマージすること。
          add-paths: data/
          delete-branch: false

      - name: Telegram に通知
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        env:
          LABEL: 要確認・新日本（LLM 抽出。マージしていない）
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/notify-telegram.sh
